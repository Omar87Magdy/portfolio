function renderAbout(){const a=PORTFOLIO_DATA.about||{};document.getElementById('navLogo').textContent=a.name||'Portfolio';document.getElementById('aboutName').textContent=a.name||'';document.getElementById('aboutRole').innerHTML=(a.role||'')+(a.company?' at <span style="color:var(--accent2)">'+a.company+'</span>':'');document.getElementById('aboutBio').textContent=a.bio||'';if(a.avatar)document.getElementById('avatarBlob').innerHTML='<img src="'+a.avatar+'" alt="avatar">';document.getElementById('contactList').innerHTML=(a.contacts||[]).map(c=>'<div class="contact-item"><div class="ci-icon">'+c.icon+'</div><a href="'+c.href+'" target="_blank">'+c.value+'</a></div>').join('');document.getElementById('statPills').innerHTML=Object.entries(PORTFOLIO_DATA.stats||{}).map(([k,v])=>'<div class="stat-pill"><strong>'+v+'</strong>'+k+'</div>').join('');}
function renderProjects(){const g=document.getElementById('projectsGrid');const p=PORTFOLIO_DATA.projects||[];g.innerHTML=p.length?p.map((p,i)=>'<div class="proj-card" onclick="openProject('+i+')"><div class="proj-emoji">'+(p.emoji||'🛠️')+'</div><div class="proj-title">'+(p.title||'')+'</div><div class="proj-desc">'+(p.shortDesc||'')+'</div><div class="proj-tags">'+(p.tags||[]).map(t=>'<span class="proj-tag">'+t+'</span>').join('')+'</div></div>').join(''):'<p style="color:var(--muted);font-family:var(--mono);font-size:.85rem">No projects yet.</p>';}
function openProject(i){const p=PORTFOLIO_DATA.projects[i];if(!p)return;let vid='';if(p.videoSrc){if(p.videoSrc.includes('youtube.com')||p.videoSrc.includes('youtu.be')){const id=p.videoSrc.match(/(?:v=|youtu\.be\/)([^&?/]+)/)?.[1]||'';vid='<div class="video-frame"><iframe src="https://www.youtube.com/embed/'+id+'" allowfullscreen></iframe></div>';}else{vid='<div class="video-frame"><video controls preload="metadata"><source src="'+p.videoSrc+'" type="video/mp4">Your browser does not support video.</video></div>';}}else{vid='<div class="video-frame"><div class="video-no-src">No video available</div></div>';}const det=Object.entries(p.details||{}).map(([k,v])=>'<div class="detail-row"><span class="detail-key">'+k+'</span><span class="detail-val">'+v+'</span></div>').join('');document.getElementById('modalBox').innerHTML='<button class="modal-close-btn" onclick="closeProjModal()">✕</button><div class="modal-title">'+(p.title||'')+'</div><div class="modal-tags">'+(p.tags||[]).map(t=>'<span class="modal-tag">'+t+'</span>').join('')+'</div><div class="modal-section">Description</div><p class="modal-desc">'+(p.desc||p.shortDesc||'')+'</p><div class="modal-section">Demo Video</div><div class="video-box">'+vid+(p.videoDesc?'<div class="video-desc-bar">'+p.videoDesc+'</div>':'')+'</div>'+(det?'<div class="modal-section">Details</div><div class="detail-list">'+det+'</div>':'');document.getElementById('projModal').classList.add('open');document.body.style.overflow='hidden';}
function closeProjModal(){document.getElementById('projModal').classList.remove('open');document.body.style.overflow='';}
function renderCerts(){const t=document.getElementById('certTrack');const c=PORTFOLIO_DATA.certs||[];t.innerHTML=c.length?c.map(c=>'<div class="cert-card"><div class="cert-inner"><div class="cert-img" onclick="openLightbox(this)">'+(c.image?'<img src="'+c.image+'" alt="'+c.title+'">':c.emoji||'🏆')+'</div><div class="cert-body"><div class="cert-title">'+(c.title||'')+'</div><div class="cert-issuer">'+(c.issuer||'')+'</div><div class="cert-date">'+(c.date||'')+'</div></div></div></div>').join(''):'<p style="color:var(--muted);font-family:var(--mono)">No certs yet.</p>';if(c.length)initCarousel();}
let cPage=0,cAuto;function initCarousel(){cPage=0;clearInterval(cAuto);const t=document.getElementById('certTrack'),d=document.getElementById('certDots'),cards=t.querySelectorAll('.cert-card');function pp(){return window.innerWidth<500?1:window.innerWidth<800?2:3;}function tot(){return Math.max(1,Math.ceil(cards.length/pp()));}function go(n){const total=tot();cPage=((n%total)+total)%total;const w=t.parentElement.offsetWidth/pp();t.style.transform='translateX(-'+(cPage*w*pp()+cPage*20)+'px)';d.querySelectorAll('.dot').forEach((dot,i)=>dot.classList.toggle('active',i===cPage));clearInterval(cAuto);cAuto=setInterval(()=>go(cPage+1),4000);}d.innerHTML=Array.from({length:tot()}).map((_,i)=>'<div class="dot'+(i===0?' active':'')+'"></div>').join('');d.querySelectorAll('.dot').forEach((dot,i)=>dot.onclick=()=>go(i));document.getElementById('certPrev').onclick=()=>go(cPage-1);document.getElementById('certNext').onclick=()=>go(cPage+1);go(0);}
window.addEventListener('resize',()=>{if(document.getElementById('certTrack').querySelectorAll('.cert-card').length)initCarousel();});
function renderLabs(){const g=document.getElementById('labsGrid');const labs=PORTFOLIO_DATA.labs||[];g.innerHTML=labs.length?labs.map((l,i)=>'<div class="lab-card" onclick="toggleLab('+i+')"><div class="lab-head"><div class="lab-icon">'+(l.icon||'🧪')+'</div><div><div class="lab-title">'+(l.title||'')+'</div><div class="lab-platform">'+(l.platform||'')+'</div></div></div><div class="lab-desc">'+(l.shortDesc||'')+'</div><div class="lab-chips">'+(l.concepts||[]).slice(0,3).map(c=>'<span class="lab-chip">'+c+'</span>').join('')+'</div></div>').join(''):'<p style="color:var(--muted);font-family:var(--mono)">No labs yet.</p>';}
let openLab=null,openLabEl=null;function toggleLab(i){const g=document.getElementById('labsGrid');if(openLabEl){openLabEl.remove();openLabEl=null;if(openLab===i){openLab=null;return;}}openLab=i;const lab=PORTFOLIO_DATA.labs[i];if(!lab)return;const el=document.createElement('div');el.className='lab-detail-panel open';el.innerHTML='<div class="lab-detail-grid"><div class="lab-detail-icon">'+(lab.icon||'🧪')+'</div><div><div class="lab-detail-title">'+(lab.title||'')+'</div><p class="lab-detail-desc">'+(lab.desc||lab.shortDesc||'')+'</p><div class="concepts-label">Concepts</div><div class="concepts">'+(lab.concepts||[]).map(c=>'<span class="concept">'+c+'</span>').join('')+'</div>'+(lab.link?'<a class="lab-link" href="'+lab.link+'" target="_blank">Open Lab ↗</a>':'')+'</div></div>';openLabEl=el;const cards=g.querySelectorAll('.lab-card');const cols=Math.max(1,Math.round(g.offsetWidth/270));const lastInRow=Math.min(Math.floor(i/cols)*cols+cols,cards.length)-1;if(cards[lastInRow]?.nextSibling)g.insertBefore(el,cards[lastInRow].nextSibling);else g.appendChild(el);el.scrollIntoView({behavior:'smooth',block:'nearest'});}
function openLightbox(el){const img=el.querySelector('img');if(!img)return;document.getElementById('lbImg').src=img.src;document.getElementById('lightbox').classList.add('open');document.body.style.overflow='hidden';}
function closeLightbox(){document.getElementById('lightbox').classList.remove('open');document.body.style.overflow='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeProjModal();closeLightbox();}});
window.addEventListener('scroll',()=>{let cur='';document.querySelectorAll('section[id]').forEach(s=>{if(window.scrollY>=s.offsetTop-130)cur=s.id;});document.querySelectorAll('.nav-links a').forEach(a=>{a.style.color=a.getAttribute('href')==='#'+cur?'var(--accent)':'';});});
document.querySelectorAll('.fade').forEach(el=>{new IntersectionObserver(([e])=>{if(e.isIntersecting)e.target.classList.add('visible');},{threshold:0.08}).observe(el);});
renderAbout();renderProjects();renderCerts();renderLabs();
</script>
